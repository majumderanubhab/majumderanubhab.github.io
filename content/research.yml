      - epde2026-genai
  - id: cognition
    color: '#B91C1C'
    title: Human Behaviour and Cognition
    since: '2025'
    period: 2025 – present
    context: Collaboration with Y. Kahlon, S. Law and colleagues
    summary: This work looks at how people perceive and experience designed environments. A PRISMA-style systematic review maps the empirical evidence linking the visual features of urban spaces to users' impressions, and identifies challenges and opportunities for future research.
    highlights:
      - 'Visual impression of urban space: a review of 46 empirical studies linking visual features of urban environments to users'' experiences'
    figures: []
    publications:
      - urbsci2026-visual
